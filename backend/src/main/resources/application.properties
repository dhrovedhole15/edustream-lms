# ==============================================================================
# EduStream Spring Boot 3 & MySQL Configuration
# ==============================================================================
spring.application.name=edustream-lms-backend
server.port=8080

# ------------------------------------------------------------------------------
# MySQL Database Connection Settings
# ------------------------------------------------------------------------------
# Update username/password/host according to your local or cloud MySQL instance
spring.datasource.url=jdbc:mysql://localhost:3306/edustream_lms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configurations
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# SQL Initialization (Optional: set to 'always' to run schema.sql & data.sql)
# ------------------------------------------------------------------------------
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ------------------------------------------------------------------------------
# JWT Security Settings
# ------------------------------------------------------------------------------
app.jwt.secret=9a4f2c8d3b7e1a5f6c8d2e4a7b9c1d3e5f7a9b1c3d5e7f9a1b3c5d7e9f1a3b5c
app.jwt.expiration-ms=86400000

# ------------------------------------------------------------------------------
# CORS Allowed Origins
# ------------------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://ais-dev-y4bfb3lilm553yhjuzrocq-596413811194.asia-east1.run.app

# ------------------------------------------------------------------------------
# Swagger / OpenAPI Endpoint Configurations
# ------------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
